<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diuport ERP - Acceso al Sistema</title>
    <!-- Tailwind CSS para el diseño visual -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col justify-between bg-cover bg-center" style="background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1920&q=80');">

    <!-- Espaciador superior -->
    <div></div>

    <!-- CONTENEDOR PRINCIPAL CENTRADO -->
    <div class="max-w-4xl w-full mx-auto px-4 my-auto">
        
        <!-- TARJETA PRINCIPAL DE LOGIN -->
        <div class="bg-white rounded-xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-2">
            
            <!-- LADO IZQUIERDO: FORMULARIO DE ACCESO -->
            <div class="p-8 sm:p-10 flex flex-col justify-center">
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-slate-800">Ingresar</h2>
                    <p class="text-xs text-slate-500 mt-1">Bienvenido a la Era Digital - Diuport ERP</p>
                </div>

                <form id="loginForm" class="space-y-4">
                    <!-- RUC / Empresa -->
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">🏢</span>
                        <input type="text" id="ruc" placeholder="N° RUC / Empresa" value="20609876541" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-500" required>
                    </div>

                    <!-- Usuario -->
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">👤</span>
                        <input type="text" id="usuario" placeholder="USUARIO" value="administrador" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-500" required>
                    </div>

                    <!-- Contraseña -->
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">🔑</span>
                        <input type="password" id="password" placeholder="••••••" value="123456" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-500" required>
                    </div>

                    <!-- Botón de Ingreso -->
                    <div class="flex items-center justify-between pt-2">
                        <button type="submit" class="bg-cyan-600 hover:bg-cyan-700 text-white font-medium px-6 py-2.5 rounded-lg text-sm transition shadow-md">
                            INGRESAR
                        </button>
                        <a href="#" class="text-xs text-cyan-600 hover:underline">Olvidé mi clave</a>
                    </div>
                </form>
            </div>

            <!-- LADO DERECHO: LOGO / MARCA -->
            <div class="bg-slate-50 border-t md:border-t-0 md:border-l border-slate-100 p-8 flex flex-col items-center justify-center text-center">
                <div class="flex items-center space-x-2">
                    <div class="bg-cyan-600 text-white p-3 rounded-xl shadow-md">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <div class="text-left">
                        <h1 class="text-xl font-black tracking-wider text-slate-800">DIUPORT <span class="text-cyan-600">ERP</span></h1>
                        <p class="text-[10px] text-slate-400 font-semibold uppercase tracking-widest">Gestión Empresarial</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- ACCESOS DIRECTOS -->
        <div class="bg-white/90 backdrop-blur rounded-xl shadow-lg mt-6 p-4 border border-white/20">
            <p class="text-xs font-bold text-slate-600 mb-3 uppercase tracking-wider">ACCESOS DIRECTOS:</p>
            <div class="grid grid-cols-3 sm:grid-cols-6 gap-3 text-center">
                <a href="#" class="p-2 rounded-lg hover:bg-slate-100 transition flex flex-col items-center">
                    <span class="text-xl mb-1">🌐</span>
                    <span class="text-xs text-slate-700 font-medium">Portal</span>
                </a>
                <a href="#" class="p-2 rounded-lg hover:bg-slate-100 transition flex flex-col items-center">
                    <span class="text-xl mb-1">📋</span>
                    <span class="text-xs text-slate-700 font-medium">Catálogo</span>
                </a>
                <a href="#" class="p-2 rounded-lg hover:bg-slate-100 transition flex flex-col items-center">
                    <span class="text-xl mb-1">🏢</span>
                    <span class="text-xs text-slate-700 font-medium">Intranet</span>
                </a>
                <a href="#" class="p-2 rounded-lg hover:bg-slate-100 transition flex flex-col items-center">
                    <span class="text-xl mb-1">🛒</span>
                    <span class="text-xs text-slate-700 font-medium">Tienda</span>
                </a>
                <a href="#" class="p-2 rounded-lg hover:bg-slate-100 transition flex flex-col items-center">
                    <span class="text-xl mb-1">🅿️</span>
                    <span class="text-xs text-slate-700 font-medium">Logística</span>
                </a>
                <a href="#" class="p-2 rounded-lg hover:bg-slate-100 transition flex flex-col items-center">
                    <span class="text-xl mb-1">📖</span>
                    <span class="text-xs text-slate-700 font-medium">Reclamos</span>
                </a>
            </div>
        </div>

    </div>

    <!-- Footer simple -->
    <footer class="text-center py-4 text-xs text-slate-400">
        &copy; 2026 Diuport ERP. Todos los derechos reservados.
    </footer>

    <!-- Script de interacción del Login -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const ruc = document.getElementById('ruc').value;
            const username = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');

            // Cambiar el texto del botón visualmente para dar sensación de carga moderna
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = 'INGRESANDO...';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ruc, username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Redirección inmediata y limpia sin alertas molestas
                    window.location.href = '/dashboard';
                } else {
                    alert('Error de acceso: ' + data.message);
                    submitBtn.innerHTML = originalText;
                    submitBtn.disabled = false;
                }
            } catch (error) {
                alert('Ocurrió un error al intentar conectar con el servidor.');
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
